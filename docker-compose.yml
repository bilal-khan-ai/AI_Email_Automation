#version: '3.8'
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-support_tickets}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-support_tickets}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: always
    command: gunicorn -w 1 --threads 50 dashboard_socketio:app --bind 0.0.0.0:5000 --log-level info --timeout 120 --capture-output --enable-stdio-inheritance --access-logfile -
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    volumes:
      - .:/app
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./chromaDB:/app/chromaDB
      - ./uploads:/app/uploads
      - ./Books:/app/Books
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    restart: always
    command: python main.py
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    volumes:
      - .:/app
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./chromaDB:/app/chromaDB
      - ./uploads:/app/uploads
      - ./Books:/app/Books
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
