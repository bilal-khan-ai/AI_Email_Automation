#version: '3.8'
services:
  db:
    image: postgres:16-alpine
    restart: always
    # Bilal Khan (12/08/2026) - P0 Fix #2: Restore Postgres memory cap.
    # Uncapped Postgres on a 2GB VM causes the kernel page cache to grow to fill
    # all available RAM, pushing web + worker into swap thrashing. 300MB RAM /
    # 450MB swap matches the tuned postgres config (shared_buffers=32MB +
    # max_connections=15 * work_mem=4MB + maintenance_work_mem=16MB = ~140MB peak).
    # memswap_limit intentionally > mem_limit to absorb brief VACUUM spikes.
    mem_limit: 250m
    memswap_limit: 350m
    # Cap log files to prevent disk exhaustion
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: Asia/Kolkata
      POSTGRES_DB: ${POSTGRES_DB:-support_db}
      POSTGRES_USER: ${POSTGRES_USER:-bilal_k}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-India@123}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c shared_buffers=32MB
      -c work_mem=4MB
      -c maintenance_work_mem=16MB
      -c max_connections=25
      -c effective_cache_size=64MB
      -c wal_buffers=4MB
      -c checkpoint_completion_target=0.9
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-support_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: always
    mem_limit: 350m
    memswap_limit: 500m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Fixed: -k eventlet required for Flask-SocketIO; --threads 50 removed (incompatible with eventlet)
    command: gunicorn -k eventlet -w 1 dashboard_socketio:app --bind 0.0.0.0:5000 --log-level info --timeout 120 --capture-output --enable-stdio-inheritance --access-logfile -
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    volumes:
      - .:/app
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./chromaDB:/app/chromaDB
      - ./uploads:/app/uploads
      - ./Books:/app/Books
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    restart: always
    # Bilal Khan (05/08/2026) - Wave 2A (2GB VM): worker container RAM budget
    # Worker is heaviest: Python + OpenAI SDK + psycopg2 + Azure/Graph SDK.
    # memswap > mem_limit intentionally: absorbs backlog bursts rather than OOM-killing.
    mem_limit: 450m
    memswap_limit: 700m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: python main.py
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    volumes:
      - .:/app
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./chromaDB:/app/chromaDB
      - ./uploads:/app/uploads
      - ./Books:/app/Books
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import os, time, sys; p=\"data/worker_heartbeat.txt\"; sys.exit(0 if os.path.exists(p) and (time.time() - os.stat(p).st_mtime) < 180 else 1)'" ]
      interval: 60s
      timeout: 10s
      # Bilal Khan (05/08/2026) - Wave 2A: Increased retries+start_period to prevent false-kill during slow startup
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
